# Site
title: Dennis Miczek
description: "A blog about machine learning and software development."
author: Dennis Miczek
url: "https://dmicz.github.io"
baseurl: ""

github_username: dmicz
sitesource: "https://github.com/dmicz/dmicz.github.io"
google_analytics: G-VHNQNRP552

twitter:
  username: dennis_miczek
  card: summary
logo: /assets/img/favicon.png

date_format: "%b %-d, %Y"

# Build
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /:categories/:title/

collections:
  essays:
    output: true
    permalink: /essays/:title/

header_pages:
  - essays.markdown
  - about.markdown

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "essays"
    values:
      layout: "essay"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache

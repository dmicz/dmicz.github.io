<header class="site-header">
  <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>

  <nav class="site-nav">
    {%- for path in site.header_pages -%}
      {%- assign nav_page = site.pages | where: "path", path | first -%}
      {%- if nav_page.title -%}
        <a href="{{ nav_page.url | relative_url }}"
           {%- if page.url == nav_page.url %} aria-current="page"{% endif %}>{{ nav_page.title | escape }}</a>
      {%- endif -%}
    {%- endfor -%}

    <!-- Hidden until site.js can label it, so no-JS visitors get no dead control. -->
    <button class="theme-toggle" type="button" hidden></button>
  </nav>
</header>

---
layout: default
---
{%- assign body = content | strip -%}
{%- if body != '' -%}
  <div class="intro">{{ content }}</div>
{%- endif -%}

{%- if site.posts.size > 0 -%}
  <h1 class="list-heading">{{ page.list_title | default: 'Posts' }}</h1>
  {%- include entry-list.html items=site.posts -%}
{%- endif -%}
